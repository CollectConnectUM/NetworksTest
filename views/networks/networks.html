<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network</title>

    <link rel="icon" type="image/x-icon" href="/static/img/symbol.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand|Noto+Sans">
	<link rel="stylesheet" href="/static/css/jquery-ui-1.12.1/jquery-ui.css">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/svg.js/3.2.0/svg.min.js"></script>

    <link rel="stylesheet" href="/static/css/header.css">
	<link rel="stylesheet" href="/static/css/footer.css">

    <link rel="stylesheet" href="/static/css/networks.css">
    <link rel="stylesheet" href="/static/css/infoPage.css">
</head>
<body>
    <div id="page-container">
    <div id="content-wrap">
        <!-- Include header -->
        <div id="header"></div>

        <!--page body-->
        <main id="main-content" role="main">
            <div id="view">
                <div id="viewHeader">
                    <div id="headerButtons">
                        <button class="headerButton" id="back-button">Back</button>
                        <button class="headerButton" id="info-button" onclick="doOpenModal()">Info</button>
                        <button class="headerButton" id="grid-button">Grid</button>
                    </div>
                    <div id="viewSelect">
                        <div id="vsBox">
                            <button class="viewSButton" id="map-button" style="margin-right: 2px;">Map</button>
                            <button class="viewSButton" id="edit-button" style="margin-left: 2px;">Edit</button>
                        </div>
                    </div>
                    <div id="infoPanel">
                        <div id="collapseDiv" >
                            <h2 id="collapseName" class="nameCollapse">Test Network</h2>
                            <button id="collapseButton" aria-label="collapse info panel"><img src="/static/img/arrow.svg" aria-hidden="true" id="collapseIcon"></button>
                        </div>
                        <ul id="infoList">
                            <li class="property" id="Name" style="flex-grow: 0; padding-bottom:0; padding-top:0;">
                                <h2 id="property-name">Test Network</h2>
                                <p class="propertyInfo">By <span>
                                    <a id="owner">Developer</a>
                                </span></p>
                            </li>
                            <li class="property" id="Description">
                                <h2 class="propertyName">Description</h2>
                                <p class="propertyInfo">Network Description</p>
                            </li>
                        </ul>
                    </div>
                </div>
                <div id="SVGDiv">
                    <div id="editDiv">
                    
                    </div>
                </div>  
            </div>
            <div id="modal" title="Network Info" tabindex="-1">
                <div class="modalContent">
                    <div id="column1" class="column">
                        <div id="name" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Name</h3>
                            </div>
                            <div class="infoBox">
                                <p id="nameVal">Testing name</p>
                            </div>
                        </div>
                        <div id="desc" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Description</h3>
                            </div>
                            <div id="descBox" class="infoBox">
                                <p id="descVal">Testing description</p>
                            </div>
                        </div>
                    </div>
                    <div id="column2" class="column">
                        <div id="createdBy" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Created By</h3>
                            </div>
                            <div class="infoBox">
                                <p id="authorVal">Testing created by</p>
                            </div>
                        </div>
                        <div id="creationDate" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Created Date</h3>
                            </div>
                            <div class="infoBox">
                                <p id="createdVal">11/01/2023</p>
                            </div>
                        </div>
                        <div id="modifiedDate" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Last Modified Date</h3>
                            </div>
                            <div class="infoBox">
                                <p id="modifiedVal">12/01/2023</p>
                            </div>
                        </div>
                    </div>
                    <div id="column3" class="column">
                        <div id="nodes" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Nodes</h3>
                            </div>
                            <div class="infoBox">
                                <ul id="nodesList"></ul>
                            </div>
                        </div>
                        <div id="edges" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Edges</h3>
                            </div>
                            <div class="infoBox">
                                <ul id="edgesList"></ul>
                            </div>
                        </div>
                        <div id="collabSettings" class="infoType">
                            <div class="infoTitle" tabindex="0">
                                <h3>Collaboration Settings</h3>
                            </div>
                            <div class="infoBox">
                                <p id="collabVal">Public</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    </div>

        <!-- Include footer -->
        <div id="footer"></div>

    </div>

    <script src="/views/headers/incorporateHeader.js"></script>
    <script src="/views/headers/incorporateFooter.js"></script>
    <script type="module" src="/views/networks/networks.js"></script>

</body>
</html>
